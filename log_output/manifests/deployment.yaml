apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: log-output
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:  # Define a shared volume for the containers
        - name: log-volume
          emptyDir: {}
      containers:
        - name: log-output-writer
          image: log-output-writer:1.10
          volumeMounts: # Mount the shared volume in the writer container
            - name: log-volume
              mountPath: /usr/src/app/files
        - name: log-output-reader
          image: log-output-reader:1.10
          env:
            - name: PORT
              value: "3000"
          volumeMounts: # Mount the shared volume in the reader container
            - name: log-volume
              mountPath: /usr/src/app/files
