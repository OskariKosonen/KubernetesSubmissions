apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ping-pong
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - image: ping-pong:1.11
          name: ping-pong
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-volume
              mountPath: /usr/src/app/files
